<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<!-- Also what makes Cloudflare Pages answer a missing file with 404: with no
     404.html it serves index.html, as for a single-page app, and the app and
     the price build read a 404 as "not there". -->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 32px 16px; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #10141b; }
  main { max-width: 680px; margin: 0 auto; }
  a { color: #2b6cb0; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1115; color: #e9edf3; }
    a { color: #7fb2ff; }
  }
</style>
</head>
<body>
<main>
  <h1>Not found</h1>
  <p>Nothing is here. See <a href="privacy.html">the privacy policy</a> or <a href="support.html">support</a>.</p>
</main>
</body>
</html>
