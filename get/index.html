<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Stacksmith</title>
<meta property="og:title" content="Stacksmith: MTG Card Scanner">
<meta property="og:description" content="Scan your Magic cards. On the App Store and Google Play.">
<meta property="og:image" content="https://stacksmith-app.pages.dev/get/icon.png">
<script>
// One link for both stores (the Instagram Story's link sticker): an iPhone or iPad goes to the
// App Store, an Android phone to Google Play, anything else stays here and picks a button.
// Nothing is stored or sent anywhere.
var STORES = {
  ios: 'https://apps.apple.com/app/id6817541736',
  android: 'https://play.google.com/store/apps/details?id=com.kuruton.stacksmith'
};
function pickStore(ua, touchPoints) {
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && touchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return null;
}
var store = pickStore(navigator.userAgent || '', navigator.maxTouchPoints || 0);
if (store) location.replace(STORES[store]);
</script>

  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
