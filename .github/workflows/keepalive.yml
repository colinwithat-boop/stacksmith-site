# GitHub turns off a public repository's scheduled workflows after 60 days
# without a commit, and the daily prices (prices.yml) would stop with them.
# Once a week this commits today's date to .github/keepalive when nothing
# has been committed for 40 days (a push with the workflow's own token
# starts no other workflow, so nothing is republished), and asks GitHub to
# keep the scheduled workflows on (a no-op while they are).
name: Keep schedules on

on:
  schedule:
    - cron: '41 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit the date when nothing was committed for 40 days
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 40 * 86400 )) ]; then
            echo "A commit in the last 40 days: nothing to do."
            exit 0
          fi
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "Stacksmith"
          git config user.email "stackscanapp@gmail.com"
          git add .github/keepalive
          git commit -m "Keep the scheduled workflows on ($(date -u +%Y-%m-%d))"
          git push
      - name: Keep the scheduled workflows enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in prices.yml set-names.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable"
          done
