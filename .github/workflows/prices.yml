# Publishes the site to GitHub Pages with the day's price file in it:
# prices/latest.json, built from Scryfall's default_cards bulk data (which
# Scryfall refreshes around 09:00 UTC), for the Stacksmith app's daily
# price update. Runs every morning, on any push to main (so the privacy
# page, the packs and sets/names.json go live too; the set-names workflow
# dispatches it after its own commit), and by hand from the Actions tab.
# The site is deployed from this workflow's artifact, not from the branch,
# so the file never enters the repository's history.
name: Publish site with prices

on:
  schedule:
    - cron: '20 10 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the site
        run: |
          mkdir -p _site
          cp index.html privacy.html support.html _site/
          cp -r packs sets _site/
      - name: Build the price file from Scryfall's bulk data
        run: node scripts/build-prices.mjs --out _site/prices/latest.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
